name: BharatStockWidget
options:
  bundleIdPrefix: com.ravisubramaniam
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

packages:
  BharatStockCore:
    path: Packages/BharatStockCore

settingGroups:
  common:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: $(CODE_SIGN_STYLE)
    CODE_SIGNING_ALLOWED: $(CODE_SIGNING_ALLOWED)
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # BSW_APP_GROUP, CODE_SIGN_STYLE, CODE_SIGNING_ALLOWED are defined in Config/Signing.xcconfig


targets:
  BharatStockApp:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: BharatStockCore
      - target: BharatStockWidgetExtension
        embed: true
        codeSign: true
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: BharatStock Widget
        PRODUCT_BUNDLE_IDENTIFIER: com.ravisubramaniam.bharatstockwidget
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/BharatStockApp.entitlements
        # Deliberately NOT sandboxed. The app maintains the hand-editable symlink at
        # ~/Library/Application Support/BharatStockWidget/config.json, and a sandboxed process
        # has that path redirected into its own container, which would defeat the point.
        # App Groups still work for a non-sandboxed Developer-ID app.
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]

  BharatStockWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: BharatStockCore
    settings:
      groups: [common]
      base:
        PRODUCT_NAME: BharatStockWidgetExtension
        PRODUCT_BUNDLE_IDENTIFIER: com.ravisubramaniam.bharatstockwidget.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/BharatStockWidget.entitlements
        # Widget extensions must be sandboxed; this is not a choice.
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          ["$(inherited)", "@executable_path/../../../../Frameworks", "@executable_path/../../Frameworks"]

schemes:
  BharatStockApp:
    build:
      targets:
        BharatStockApp: all
        BharatStockWidgetExtension: all
    run:
      config: Debug
    # The core package's tests run via `swift test` (see the Makefile). They need no Xcode
    # project, which is the point of keeping the core in SPM.
    test:
      config: Debug

  BharatStockWidgetExtension:
    build:
      targets:
        BharatStockWidgetExtension: all
    run:
      config: Debug

